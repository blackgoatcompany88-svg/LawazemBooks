kind = "mobile"
previewPath = "/"
title = "اللوازم المدرسية"
version = "1.0.0"
id = "artifacts/school-books"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20521

[services.development]
run = "pnpm --filter @workspace/school-books run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/school-books", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/school-books", "run", "serve" ]

[services.env]
PORT = "20521"
BASE_PATH = "/"
